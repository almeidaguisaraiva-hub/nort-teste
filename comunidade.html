<!doctype html>
<html lang="pt-BR" data-palette="floresta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nort Comunidade — protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Floresta palette (same tokens as src/styles.css) */
:root {
  --bg: #EAF5EE; --surface: #FFFFFF; --soft: #D2EADB; --ink: #0D3B2A; --ink-2: #1E5240; --muted: #3C5F50; --line: #B6D7C3;
  --accent: #0E7A4D; --accent-ink: #FFFFFF; --accent-soft: #D2EADB; --coral: #E8684A;
  --disabled-bg: #C3DDCC; --disabled-ink: #1E5240;
  --warn: #8F2E1A; --warn-soft: #F9E4DE;
  --banner-bg: #0D3B2A; --banner-ink: #FFFFFF;
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 18px;
  --shadow: 0 1px 2px rgba(13, 59, 42, .06), 0 12px 26px -18px rgba(13, 59, 42, .4);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A2018; --surface: #102C21; --soft: #173B2D; --ink: #E3F3EA; --ink-2: #BEE0CD; --muted: #9CC4AF; --line: #24503E;
    --accent: #4FCB91; --accent-ink: #072117; --accent-soft: #173B2D;
    --disabled-bg: #24503E; --disabled-ink: #9CC4AF;
    --warn: #F8D3C8; --warn-soft: #45221B;
    --banner-bg: #E3F3EA; --banner-ink: #0A2018;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 26px -18px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.5 var(--font); }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 8px; }
h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: 20px; font-weight: 800; }
h3 { font-size: 17px; font-weight: 800; }
p { margin: 0 0 10px; }
ul { margin: 0; padding-left: 20px; }
li { margin: 4px 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.banner { position: sticky; top: 0; z-index: 30; background: var(--banner-bg); color: var(--banner-ink); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 4px 16px; font-size: 14px; font-weight: 700; }
.lang { min-height: 44px; min-width: 64px; border: 2px solid currentColor; background: transparent; color: inherit; border-radius: 999px; font: 800 14px var(--font); cursor: pointer; }
.top { position: sticky; top: 52px; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-weight: 800; font-size: 19px; min-height: 44px; }
.brand svg { width: 30px; height: 30px; color: var(--accent); }
.brand > span { display: grid; line-height: 1.05; }
.brand small { font-weight: 700; color: var(--muted); font-size: 13px; }

main { max-width: 480px; margin: 0 auto; padding: 18px 16px 110px; }
main.room-main { padding-bottom: 170px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin: 0 0 14px; }
.soft { background: var(--soft); border-radius: var(--r); padding: 14px 16px; margin: 0 0 14px; }
.lead { color: var(--ink-2); font-size: 17px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.tag.example { background: transparent; border: 1.5px dashed var(--muted); color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font: 800 16px var(--font); cursor: pointer; text-decoration: none; text-align: center; }
.btn.wide { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.line { background: transparent; color: var(--accent); }
.btn[aria-disabled="true"], .btn:disabled { background: var(--disabled-bg); border-color: var(--disabled-bg); color: var(--disabled-ink); cursor: not-allowed; }
.btn.help { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.sm { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn svg { width: 20px; height: 20px; flex: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.isnot { display: grid; grid-template-columns: 1fr; gap: 10px; }
.isnot > div { border-radius: 14px; padding: 12px 14px; }
.is { background: var(--accent-soft); }
.not { background: var(--surface); border: 1px solid var(--line); }
.rules { counter-reset: r; list-style: none; padding: 0; margin: 0; }
.rules li { counter-increment: r; display: grid; grid-template-columns: 30px 1fr; gap: 8px; margin: 8px 0; }
.rules li::before { content: counter(r); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--ink); font-weight: 800; font-size: 14px; display: grid; place-items: center; }

.check { display: flex; gap: 12px; align-items: flex-start; min-height: 44px; padding: 8px 0; cursor: pointer; }
.check input { width: 26px; height: 26px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
label.field { display: block; font-weight: 800; margin: 6px 0 4px; }
input[type="text"], textarea { width: 100%; min-height: 48px; border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font: 400 17px var(--font); color: var(--ink); background: var(--surface); }
input[type="text"]:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.err { color: var(--warn); background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; font-weight: 700; margin: 10px 0 0; }
.err:empty { display: none; }

.avatars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 0; }
.av-opt { position: relative; }
.av-opt input { position: absolute; opacity: 0; inset: 0; pointer-events: none; }
.av-opt label { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); cursor: pointer; min-height: 44px; font-size: 14px; font-weight: 700; text-align: center; }
.av-opt input:checked + label { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.av-opt input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.av { width: 56px; height: 56px; flex: none; }
.av.s { width: 40px; height: 40px; }
.av.xs { width: 32px; height: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; pointer-events: none; }
.chip label { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; font-size: 15px; }
.chip input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip input:checked + label::before { content: "✓ "; white-space: pre; }
.chip input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

.group { position: relative; }
.group .meta { display: grid; gap: 4px; margin: 8px 0 12px; font-size: 15px; color: var(--ink-2); }
.group .meta b { color: var(--ink); }
.spots { display: flex; gap: 4px; margin: 2px 0; }
.spots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent); }
.spots i.f { background: var(--accent); }
.psy { display: flex; gap: 10px; align-items: center; background: var(--bg); border-radius: 14px; padding: 10px; margin: 0 0 12px; }
.psy .who { font-size: 15px; line-height: 1.35; }
.badge { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 13px; font-weight: 800; color: var(--ink); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; }
.badge svg { width: 14px; height: 14px; color: var(--accent); }
.badge em { font-style: normal; font-weight: 700; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--accent); }
.live::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.joined-note { font-weight: 700; color: var(--ink-2); margin: 10px 0 0; font-size: 15px; }

/* room */
.room-head { display: flex; gap: 10px; align-items: center; margin: 0 0 6px; }
.back { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; gap: 4px; font-weight: 800; text-decoration: none; }
.people { display: flex; align-items: center; margin: 4px 0 10px; }
.people .av { margin-right: -8px; border: 2px solid var(--bg); border-radius: 50%; }
.people span { margin-left: 16px; font-size: 14px; color: var(--muted); font-weight: 700; }
.safety { position: sticky; top: 109px; z-index: 15; background: var(--bg); padding: 8px 0 10px; margin: 0 0 8px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.safety .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.safety .three .btn { padding: 6px 4px; font-size: 14px; min-height: 44px; }
.pinned { border-left: 5px solid var(--accent); }
.pinned summary { cursor: pointer; font-weight: 800; min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none; }
.pinned summary::-webkit-details-marker { display: none; }
.pinned summary::after { content: "▾"; margin-left: auto; }
.pinned[open] summary::after { content: "▴"; }
.msgs > li { scroll-margin: 200px 0 150px; }
.msgs { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.msg { display: grid; grid-template-columns: 40px 1fr; gap: 10px; }
.msg > .av { align-self: start; }
.msg .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 10px 12px; }
.msg.mine { grid-template-columns: 1fr 40px; }
.msg.mine .av { order: 2; }
.msg.mine .bubble { background: var(--accent-soft); border-color: transparent; border-radius: 16px 4px 16px 16px; }
.msg.psy .bubble { border: 2px solid var(--accent); }
.msg .name { font-weight: 800; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.msg .name .role { font-weight: 700; color: var(--accent); }
.msg p { margin: 2px 0 0; }
.reacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.react { min-height: 44px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: 700 14px var(--font); cursor: pointer; }
.react[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sys { text-align: center; font-size: 14px; color: var(--muted); font-weight: 700; background: var(--soft); border-radius: 12px; padding: 8px 12px; }
.pending { font-size: 13px; font-weight: 800; color: var(--muted); margin-top: 6px; }
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.composer form { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
.composer textarea { min-height: 52px; max-height: 120px; resize: none; }
.composer .hint { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 0; }

/* bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs ul { max-width: 480px; margin: 0 auto; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs li { margin: 0; }
nav.tabs a { display: grid; justify-items: center; gap: 2px; min-height: 60px; padding: 8px 2px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 800; }
nav.tabs a svg { width: 24px; height: 24px; }
nav.tabs a[aria-current="page"] { color: var(--accent); }
nav.tabs a[aria-current="page"] span { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 2px; }

/* phase 2 */
.soon { display: inline-flex; font-size: 13px; font-weight: 800; padding: 3px 10px; border-radius: 999px; border: 2px solid var(--ink); }
.post { border-top: 1px solid var(--line); padding: 10px 0 0; margin: 10px 0 0; display: grid; grid-template-columns: 32px 1fr; gap: 10px; font-size: 15px; }
.post .name { font-weight: 800; font-size: 14px; }
.locked { font-size: 14px; color: var(--muted); font-weight: 700; border: 2px dashed var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 12px; }

/* privacy */
.yes-no li { list-style: none; margin: 8px 0; padding-left: 0; display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.yes-no { padding: 0; }
.ok-i { color: var(--accent); font-weight: 800; }
.no-i { color: var(--warn); font-weight: 800; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 999px; background: var(--disabled-bg); position: relative; flex: none; cursor: pointer; border: 2px solid var(--muted); }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 1px solid var(--muted); transition: transform .2s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(20px); }
.switch input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.profile { display: flex; gap: 12px; align-items: center; }

/* dialogs */
dialog { width: min(440px, calc(100vw - 24px)); max-height: calc(100vh - 32px); border: none; border-radius: 22px; padding: 20px 18px; background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(6, 25, 18, .6); }
dialog h2 { font-size: 22px; }
.lines { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 8px; }
.lines li { margin: 0; }
.lines a { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; border-radius: 14px; background: var(--bg); border: 1.5px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 700; }
.lines a b { font-size: 20px; color: var(--accent); white-space: nowrap; }
.country { font-size: 14px; font-weight: 800; color: var(--muted); margin: 12px 0 0; text-transform: uppercase; letter-spacing: .04em; }
.radios { display: grid; gap: 4px; border: none; padding: 0; margin: 8px 0; }
.radios legend { font-weight: 800; padding: 0; margin-bottom: 4px; }
.radios label { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; }
.radios input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.dlg-actions { display: grid; gap: 8px; margin-top: 14px; }
.demo-note { font-size: 13px; color: var(--muted); font-weight: 700; border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="banner" role="note">
  <span id="banner-text">Protótipo — pessoas e mensagens de exemplo</span>
  <button class="lang" id="lang" type="button" aria-label="Switch to English">EN</button>
</div>
<header class="top">
  <a class="brand" href="#entrada" id="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 1.2 L19 6.4 L13 6.4 Z" style="fill: var(--coral)"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M29.2 16h-2.4M5.2 16H2.8M16 29.2v-2.4"/></g><path d="M11.2 21.6V10.4h1.6l6 8.2v-8.2h1.9v11.2h-1.6l-6-8.2v8.2z" fill="currentColor"/></svg><span>nort <small id="brand-sub">comunidade</small></span></a>
  <button class="btn help sm" type="button" id="help-top" data-help></button>
</header>
<main id="main" tabindex="-1"></main>
<div id="bottom"></div>
<div class="sr" aria-live="polite" id="live"></div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<script>
(function () {
  'use strict';
  const S = {
    lang: 'pt', entered: false, nick: '', avatar: 'nort', themes: [], age: false, rules: false,
    joined: { trabalho: true }, mine: {}, reacted: {}, blocked: {}, showThemes: true, shareNort: false, left: {},
  };
  try { const l = localStorage.getItem('nort-com-lang'); if (l === 'en' || l === 'pt') S.lang = l; } catch (e) { /* ignore */ }
  const $ = (q, el) => (el || document).querySelector(q);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const T = (pt, en) => (S.lang === 'en' ? en : pt);
  const t = (o) => (o && typeof o === 'object' ? (o[S.lang] || o.en) : o);
  const live = (msg) => { const el = $('#live'); el.textContent = ''; setTimeout(() => { el.textContent = msg; }, 30); };

  /* ---------- simple 2D characters ---------- */
  const LOOKS = {
    nort: { bg: '#A6DDBD', skin: '#C98B5E', hair: '#2B1B12', style: 'curly', shirt: '#0E7A4D' },
    sol: { bg: '#F3D9A8', skin: '#F1C7A3', hair: '#B5651D', style: 'long', shirt: '#4B6FB3' },
    mar: { bg: '#B9D3E3', skin: '#8D5A3B', hair: '#1A1310', style: 'short', shirt: '#7A4FA3' },
    lua: { bg: '#D3CEEA', skin: '#E7B892', hair: '#3A2A20', style: 'bun', shirt: '#B34F6B' },
    rio: { bg: '#B5DCCB', skin: '#6B4128', hair: '#0F0B09', style: 'afro', shirt: '#2F6F8F' },
    ceu: { bg: '#F3C2B3', skin: '#F5D3B8', hair: '#D9C27A', style: 'short', shirt: '#3C5F50' },
    psyA: { bg: '#ADD9C1', skin: '#D6A37E', hair: '#5A3A28', style: 'long', shirt: '#0D3B2A' },
    psyB: { bg: '#B9D3E3', skin: '#9C6644', hair: '#222', style: 'short', shirt: '#0D3B2A' },
  };
  function hair(style, c) {
    switch (style) {
      case 'curly': return `<g fill="${c}"><circle cx="19" cy="20" r="7"/><circle cx="27" cy="16" r="7"/><circle cx="36" cy="16" r="7"/><circle cx="44" cy="20" r="7"/><circle cx="17" cy="28" r="5"/><circle cx="46" cy="28" r="5"/></g>`;
      case 'long': return `<path fill="${c}" d="M14 30c0-12 8-19 18-19s18 7 18 19v16h-6V30c-4-2-9-6-12-10-3 5-9 9-12 10v16h-6z"/>`;
      case 'bun': return `<g fill="${c}"><circle cx="32" cy="9" r="6"/><path d="M15 29c0-11 7-17 17-17s17 6 17 17c-6-1-13-5-17-9-4 4-11 8-17 9z"/></g>`;
      case 'afro': return `<circle cx="32" cy="24" r="19" fill="${c}"/>`;
      default: return `<path fill="${c}" d="M15 28c0-11 7-16 17-16s17 5 17 16c-3-4-9-6-17-6s-14 2-17 6z"/>`;
    }
  }
  function avatar(key, cls, label) {
    const k = LOOKS[key] || LOOKS.nort;
    const lab = label ? ` role="img" aria-label="${esc(label)}"` : ' aria-hidden="true"';
    return `<svg class="av ${cls || ''}" viewBox="0 0 64 64"${lab}><circle cx="32" cy="32" r="32" fill="${k.bg}"/><path d="M12 64c2-12 10-17 20-17s18 5 20 17z" fill="${k.shirt}"/><rect x="28" y="38" width="8" height="10" rx="3" fill="${k.skin}"/>${k.style === 'afro' ? hair('afro', k.hair) : ''}<ellipse cx="32" cy="29" rx="13" ry="14" fill="${k.skin}"/>${k.style !== 'afro' ? hair(k.style, k.hair) : ''}<circle cx="27" cy="30" r="1.8" fill="#1A1310"/><circle cx="37" cy="30" r="1.8" fill="#1A1310"/><path d="M27.5 35.5c2.6 2.2 6.4 2.2 9 0" stroke="#1A1310" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>`;
  }

  /* ---------- icons ---------- */
  const IC = {
    life: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/></svg>',

  /* ---------- on-device message check (first layer only) ---------- */
  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, '');
  const RISK = ['quero morrer', 'queria morrer', 'vontade de morrer', 'me matar', 'suicid', 'tirar minha vida', 'tirar a minha vida', 'acabar com a minha vida', 'acabar com minha vida', 'acabar com tudo', 'nao quero mais viver', 'nao aguento mais viver', 'me cortar', 'me machucar', 'want to die', 'wanna die', 'kill myself', 'end my life', 'end it all', 'dont want to live', 'hurt myself', 'cut myself', 'better off dead', 'melhor morto', 'melhor morta'];
  const FLAGS = [
    { rule: 2, re: /\b(remedio|remedios|medicamento|medicacao|dose|\d+\s?mg|parar de tomar|pare de tomar|para de tomar|rivotril|clonazepam|sertralina|fluoxetina|escitalopram|ritalina|venvanse|medication|meds|stop taking|sertraline|xanax|adderall)\b/ },
    { rule: 3, re: /\b\d+\s?(kg|quilos|kcal|calorias|calories)\b/ },
    { rule: 4, re: /\b(pix|compre|vendo|promocao|desconto|buy now|for sale|discount)\b/ },
    { rule: 5, re: /([\w.+-]+@[\w-]+\.[\w.]+)|(\+?\d[\d\s().-]{7,}\d)/ },
  ];
  function checkText(text) {
    const n = norm(text);
    if (RISK.some((w) => n.includes(w))) return { risk: true };
    const f = FLAGS.find((x) => x.re.test(n));
    return f ? { rule: f.rule } : {};
  }

  function msgHtml(m, i, gid) {
    if (m.sys) return `<li class="sys">${t(m.text)}</li>`;

    }
    const isPsy = !!m.psy;
    const p = isPsy ? PSY[m.who] : PEOPLE[m.who];
    const nick = isPsy ? p.name : p.nick;
    if (!isPsy && S.blocked[m.who]) return `<li class="sys">${T(`Você bloqueou ${esc(nick)}. As mensagens dessa pessoa ficam escondidas para você.`, `You blocked ${esc(nick)}. Their messages are hidden for you.`)}</li>`;

  function bindSala(gid) {
    const g = GROUPS.find((x) => x.id === gid) || GROUPS[0];
    $('#main').addEventListener('click', (e) => {
      const r = e.target.closest('[data-react]');
      if (r) {
        const k = r.dataset.react;
        S.reacted[k] = S.reacted[k] === r.dataset.r ? null : r.dataset.r;
        r.parentElement.querySelectorAll('.react').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.r === S.reacted[k])));
        live(S.reacted[k] ? T('Apoio enviado. Só a pessoa vê.', 'Support sent. Only that person sees it.') : T('Apoio retirado.', 'Support removed.'));
      }
      if (e.target.closest('[data-report]')) reportDlg();
      if (e.target.closest('[data-block]')) blockDlg();
      const l = e.target.closest('[data-leave]');
      if (l) leaveDlg(l.dataset.leave);
    });
    const f = $('#send');
    if (!f) return;
    const ta = $('#txt');
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = ta.value.trim();
      if (!text) { ta.focus(); return; }
      if (!S.entered) { location.hash = '#entrada'; return; }
      const c = checkText(text);
      if (c.risk) { ta.value = ''; helpDlg(true); return; }
      if (c.rule) { flagDlg(c.rule, text, g); return; }
      post(g, { mine: true, text, support: 0 });
    });
  }
  function post(g, m) {
    (S.mine[g.id] = S.mine[g.id] || []).push(m);
    const list = $('#msgs');
    list.insertAdjacentHTML('beforeend', msgHtml(m, ROOM.length + S.mine[g.id].length - 1, g.id));
    $('#txt').value = '';
    list.lastElementChild.scrollIntoView({ block: 'end' });
    live(m.pending ? T('Mensagem enviada para a moderação revisar.', 'Message sent for moderator review.') : T('Mensagem enviada.', 'Message sent.'));
    const li = list.lastElementChild;
    if (!m.pending) setTimeout(() => { m.support = 2; if (document.contains(li)) li.outerHTML = msgHtml(m, 0, g.id); }, 2500);
  }

    openDlg(`
      <h2 id="dlg-title">${T('Bloquear', 'Block')}</h2>
      <p class="small">${T('Você deixa de ver as mensagens da pessoa, e ela não pode falar com você. Ela não é avisada. A psicóloga moderadora não pode ser bloqueada; se algo der errado com ela, use Denunciar.', 'You stop seeing their messages and they can’t contact you. They aren’t notified. The moderating psychologist can’t be blocked; if something goes wrong with her, use Report.')}</p>
      <form id="blk">${peopleRadios('bk', false)}
        <div class="dlg-actions"><button class="btn wide" type="submit">${T('Bloquear', 'Block')}</button><button class="btn ghost wide" type="button" data-close>${T('Cancelar', 'Cancel')}</button></div>
      </form>`, () => {
      $('#blk').addEventListener('submit', (e) => {
        e.preventDefault();
        const k = $('#blk').querySelector('input[name=bk]:checked').value;
        S.blocked[k] = true; closeDlg(); render(true);
        live(T(`${PEOPLE[k].nick} foi bloqueado.`, `${PEOPLE[k].nick} was blocked.`));
        const b = document.querySelector('[data-block]'); if (b) b.focus();
      });
    });
  }
  function leaveDlg(gid) {
    confirmDlg(T('Sair do grupo?', 'Leave the group?'),
      T('Tudo bem sair, sem explicar nada. Você pode voltar se ainda houver vaga.', 'It’s fine to leave, no explanation needed. You can come back if there’s still a spot.'),
      T('Sair do grupo', 'Leave group'),
      () => { S.left[gid] = true; location.hash = '#grupos'; live(T('Você saiu do grupo.', 'You left the group.')); });
  }
  function confirmDlg(title, body, okLabel, onOk) {
    openDlg(`<h2 id="dlg-title">${title}</h2><p>${body}</p>
      <div class="dlg-actions"><button class="btn wide" type="button" data-ok>${okLabel}</button><button class="btn ghost wide" type="button" data-close autofocus>${T('Cancelar', 'Cancel')}</button></div>
      <p class="demo-note">${T('Demonstração: nada foi enviado.', 'Demo: nothing was sent.')}</p>`, () => {
      dlg.querySelector('[data-ok]').addEventListener('click', () => { lastFocus = null; closeDlg(); onOk(); });
    });
  }

  /* ---------- render ---------- */
  function render(keepScroll) {
    const r = route();
    const main = $('#main');
    const fresh = main.cloneNode(false);
    main.replaceWith(fresh);
    chrome();
    let html = ''; let bottom = ''; let bind = null;
    const inRoom = r.name === 'sala';
    $('#help-top').hidden = inRoom;
    fresh.className = inRoom ? 'room-main' : '';
    if (r.name === 'grupos') { html = scrGrupos(); bind = bindGrupos; bottom = tabs('grupos'); }
    else if (inRoom) { const g = GROUPS.find((x) => x.id === r.arg) || GROUPS[0]; html = scrSala(g.id); bind = () => bindSala(g.id); bottom = composer(g); }
    else if (r.name === 'salas') { html = scrSalas(); bottom = tabs('salas'); }
    else if (r.name === 'privacidade') { html = scrPriv(); bind = bindPriv; bottom = tabs('privacidade'); }
    else { html = scrEntrada(); bind = bindEntrada; bottom = tabs('entrada'); }
    fresh.innerHTML = html;
    $('#bottom').innerHTML = bottom;
    if (bind) bind();
    const titles = { grupos: T('Grupos', 'Groups'), sala: T('Sala do grupo', 'Group room'), salas: T('Salas por tema', 'Theme rooms'), privacidade: T('Privacidade', 'Privacy') };
    document.title = `${titles[r.name] || T('Entrada', 'Welcome')} · Nort ${T('Comunidade', 'Community')}`;
    if (!keepScroll) {
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
      const h1 = fresh.querySelector('h1');
      if (h1 && document.activeElement !== $('#lang')) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
    }
  }
  document.addEventListener('click', (e) => { if (e.target.closest('[data-help]')) helpDlg(false); });
  $('#lang').addEventListener('click', () => {
    S.lang = S.lang === 'en' ? 'pt' : 'en';
    try { localStorage.setItem('nort-com-lang', S.lang); } catch (e) { /* ignore */ }
    if (location.hash.startsWith('#entrada') || !location.hash) {
      const n = $('#nick'); if (n) S.nick = n.value.trim();
    }
    render(true);
    $('#lang').focus();
  });
  window.addEventListener('hashchange', () => { closeDlg(); render(false); });
  render(true);
})();
</script>
</body>
</html>
