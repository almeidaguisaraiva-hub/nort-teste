  function swipeOk(it, area) { return exp.interact && SWIPE_OPTS.includes(it.opt) && !SKIPPABLE.includes(area) && area !== 'safety'; }
  function swipeControl(it) {
    const o = OPT[it.opt]; const labels = optLabels(it.opt); const yes = o.values.indexOf(1), no = o.values.indexOf(0);
    return `<div class="swipe" data-swipe="${it.id}" data-opt="${it.opt}" data-yes="${yes}" data-no="${no}" aria-hidden="true"><span class="sw-l">${esc(labels[no])}</span><span class="sw-knob"><svg viewBox="0 0 20 20"><path d="M10 2 L13.5 10 L10 18 L6.5 10 Z"/></svg></span><span class="sw-r">${esc(labels[yes])}</span></div><p class="small center sw-hint" aria-hidden="true">${esc(S().swipeHint)}</p>`;
  }
  function textControl(it) {
    const id = it.id.replace(/\./g, '_');
    return `<label class="sr" for="${id}">${esc(tx(it.text))}</label><textarea id="${id}" data-text="${it.id}" rows="3" placeholder="${esc(S().optional)}">${esc(state.answers[it.id] || '')}</textarea>`;
  }

  function viewQuiz() {
    const s = S();
    const cards = currentCards();
    const i = currentIndex(cards);
    const card = cards[i];
    const chapters = cards.filter((c) => c.type === 'chapter');
    const chIdx = cards.slice(0, i + 1).filter((c) => c.type === 'chapter').length;
    const pct = Math.round((i / cards.length) * 100);
    const isLast = i === cards.length - 1;
    // General questionnaire: progress counts questions, not topics
    const qCount = cards.filter((c) => c.type === 'q').length;
    const qBefore = cards.slice(0, i).filter((c) => c.type === 'q').length;
    const generalMode = state.general && state.level === 1;
    const progressText = generalMode ? fmt(s.questionOf, { i: Math.min(qBefore + 1, qCount), n: qCount }) : fmt(s.chapterOf, { i: Math.max(chIdx, 1), n: chapters.length });
    const dots = chapters.map((c, k) => `<span class="dot ${tint(c.area)}${k + 1 < chIdx ? ' done' : k + 1 === chIdx ? ' now' : ''}"></span>`).join('');
    const bar = `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>`;
    const top = exp.ring
      ? `<div class="quiz-top ring-top"><svg class="prog-ring" viewBox="0 0 72 72" aria-hidden="true">${ringSegments(chapters.map((c, k) => ({ area: c.area, state: k + 1 < chIdx ? 'done' : k + 1 === chIdx ? 'now' : 'todo', just: c.key === state.justDone })), 72, 29, 9, 5)}<path class="nd-n2" d="M36 17 L40 36 L36 33 L32 36 Z"/><path class="nd-s2" d="M36 55 L40 36 L36 39 L32 36 Z"/></svg><div class="ring-meta"><span>${esc(s.level)} ${state.level}</span><strong>${esc(progressText)}</strong></div>${bar}</div>`
      : `<div class="quiz-top"><div class="quiz-meta"><span>${esc(s.level)} ${state.level}</span><span>${esc(progressText)}</span></div>
      ${bar}
      <div class="dots" aria-hidden="true">${dots}</div></div>`;
    let body = '';
    const backBtn = `<button class="btn link" data-act="back">← ${esc(s.back)}</button>`;
    if (card.type === 'chapter') {
      const m = card.mod;
      const notes = [];
      const skippable = SKIPPABLE.includes(card.area);
      if (m.first) notes.push(`<p class="note">${esc(s.generalIntro)}</p>`);
      if (card.skipped) notes.push(`<p class="note">${esc(m.hideTopic ? s.skippedPart : s.skippedTopic)}</p>`);
      else if (card.area === 'memory') notes.push(`<p class="note sensitive">${esc(s.memoryNote)}</p>`);
      else if (skippable) notes.push(`<p class="note sensitive">${esc(m.hideTopic ? s.sensitivePart : s.sensitiveTopic)}</p>`);
      else if (m.sensitive || card.area === 'safety') notes.push(`<p class="note">${esc(s.sensitiveNote)}</p>`);
      if ((m.provisional || m.sections.some((x) => x.provisional)) && !card.skipped) notes.push(`<p class="note prov">${esc(m.toImport ? s.toImportNote : s.provisionalNote)}</p>`);
      const mainBtns = card.skipped
        ? `<button class="btn" data-act="unskip" data-area="${card.area}">${esc(s.answerNow)}</button><button class="btn primary big" data-act="advance">${esc(s.continue)}</button>`
        : `${skippable ? `<button class="btn" data-act="skip" data-area="${card.area}">${esc(m.hideTopic ? s.skipPart : s.skipTopic)}</button>` : ''}<button class="btn primary big" data-act="advance">${esc(s.letsGo)}</button>`;
      body = `<section class="qcard chapter ${reduceMotion ? '' : 'enter'}">
        <div class="ill-wrap">${DIAL_MINI}<span class="rim" aria-hidden="true">${NEEDLE_MINI}</span><span class="ill-core">${icon(m.hideTopic ? 'round' : card.area)}</span></div>
        <p class="eyebrow">${esc(generalMode ? (m.first ? fmt(s.questionsN, { n: qCount }) : progressText) : `${fmt(s.chapterOf, { i: chIdx, n: chapters.length })} · ${card.count === 1 ? s.questions1 : fmt(s.questionsN, { n: card.count })}`)}</p>
        <h1 class="ch-title">${esc(chapterTitle(card))}${m.provisional ? ` <span class="chip chip-prov">${esc(s.provisionalChip)}</span>` : ''}</h1>
        <p class="ch-sub">${esc(m.subKey ? s[m.subKey] : tx(AREA_INTRO[card.area]))}</p>
        ${notes.join('')}
        <div class="qnav">${backBtn}<div class="qnav-main">${mainBtns}</div></div>
      </section>`;
    } else if (card.type === 'breath') {
      body = `<section class="qcard breath ${reduceMotion ? '' : 'enter'}">
        <h1 class="ch-title">${esc(s.breathTitle)}</h1>
        <p class="ch-sub">${esc(s.breathText)}</p>
        <div class="breath-circle${reduceMotion ? ' still' : ''}" aria-hidden="true"><span id="breath-word">${esc(reduceMotion ? '' : s.breathIn)}</span></div>
        ${reduceMotion ? `<p class="small">${esc(s.breathStatic)}</p>` : ''}
        <div class="qnav">${backBtn}<button class="btn primary big" data-act="advance">${esc(s.continue)}</button></div>
      </section>`;
    } else {
      const it = card.item; const sec = card.sec; const m = card.mod;
      let ctx = '';
      if (sec.introKey && sec.items[0] === it) {
        ctx += `<div class="context"><p>${esc(s[sec.introKey])}</p>`;
        if (sec.examplesKey) ctx += `<details class="examples"><summary>${esc(s.seeExamples)}</summary><ul>${s[sec.examplesKey].map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>`;
        ctx += `</div>`;
      }
      if (it.type === 'warm' && it.id === WARMUPS[0].id) ctx += `<p class="note">${esc(s.warmFirst)}</p>`;
      if (sec.stem) ctx += `<p class="stem">${esc(tx(sec.stem))}</p>`;
      if (sec.stemKey) ctx += `<p class="stem">${esc(s[sec.stemKey])}</p>`;
      const control = it.type === 'warm' ? warmControl(it) : it.type === 'text' ? textControl(it) : (SLIDER_OPTS.includes(it.opt) ? sliderControl(it) : (swipeOk(it, card.area) ? swipeControl(it) : '') + choiceControl(it));
      const answered = it.optional || state.answers[it.id] != null;
      // "Prefer not to say" on every question that doesn't already offer it among its options
      const canDecline = it.type === 'radio' && !OPT[it.opt].values.some((v) => typeof v === 'string');
      const declined = state.answers[it.id] === 'skip';
      const declineBtn = canDecline ? `<div class="decline-row"><button type="button" class="btn link decline${declined ? ' on' : ''}" data-act="decline" data-item="${it.id}" aria-pressed="${declined}">${esc(s.preferNot)}</button></div>` : '';
      const needsNext = true;
      const nextLabel = isLast ? (card.area === 'memory' ? s.memoryDone : fmt(s.finishLevel, { n: state.level })) : (it.type === 'warm' && state.answers[it.id] == null ? s.skipWarm : s.next);
      body = `<section class="qcard ${reduceMotion ? '' : 'enter'}">
        <div class="q-area">${icon(m.hideTopic ? 'round' : card.area, 'mini-ill')}<span>${esc(chapterTitle(card))}</span>${m.provisional || sec.provisional ? `<span class="chip chip-prov">${esc(s.provisionalChip)}</span>` : ''}${it.type === 'warm' ? `<span class="chip chip-prov">${esc(s.warmChip)}</span>` : ''}</div>
        ${ctx}
        <h1 class="q-text" id="q-text">${esc(tx(it.text))}</h1>
        ${control}
        ${declineBtn}
        ${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ''}
        <div class="qnav">${backBtn}${needsNext ? `<button class="btn primary" data-act="advance" id="next-btn"${answered ? '' : ' disabled'}>${esc(nextLabel)}</button>` : ''}</div>
      </section>`;
    }
    return `<main class="stage ${tint(card.area)}${acOn(card.area) ? ' ac' : ''}" style="${acVar(card.area)}"><div class="stage-inner">${top}${body}</div></main>`;
  }

  // ---------- results ----------
  function basisPanel(key, r) {
    const s = S(); const m = SCALES[key];
    if (!m) return '';
    // Entry signal (first questions only): say so, it is not the validated score
    if (r && r.entry && r.scales[0] === key) return `<dl class="basis-dl">${[[s.f.scale, `${m.name} — ${m.full}`], [s.f.authors, m.authors], [s.f.items, fmt(s.entryItems, { n: m.items })], [s.f.license, s.lic[m.license]], [s.f.text, s.txt[m.text]], [s.f.cite, m.cite]].map((x) => `<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><p class="small">${esc(s.entryNote)}</p>`;
    const tStatus = state.lang === 'en' ? 'original' : (m.trans[state.lang] ? m.trans[state.lang] : 'missing');
    const rows = [[s.f.scale, `${m.name} — ${m.full}`], [s.f.authors, m.authors], [s.f.items, m.items], [s.f.license, s.lic[m.license]], [s.f.text, s.txt[m.text]], [s.f.trans, m.text === 'official' ? s.tr[tStatus] : '—'], [s.f.cite, m.cite]];
    return `<dl class="basis-dl">${rows.map((r) => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`;
  }
  function viewResults() {
    const s = S();
    const lvl = state.resultsLevel;
    const res = computeAreas(state, lvl);
    const flags = computeFlags(state);
    const mb = maxBand(res);
    const rec = mb === 2 ? s.recHigh : mb === 1 ? s.recAttention : s.recNone;
    const assessed = AREAS.filter((a) => res[a.id] && res[a.id].assessed).sort((x, y) => res[y.id].band - res[x.id].band);
    const notAssessed = AREAS.filter((a) => !(res[a.id] && res[a.id].assessed) && !(a.id === 'postpartum' && state.setup.baby !== 1));
    const flaggedAreas = assessed.filter((a) => res[a.id].band >= 1);
    const calmAreas = assessed.filter((a) => res[a.id].band === 0);
    const bubbles = flaggedAreas.map((a, i) => { const r = res[a.id]; return `<button class="bubble band-${r.band}${acOn(a.id) ? ' ac' : ''}" data-act="goto" data-area="${a.id}" style="${acVar(a.id)}--d:${(5.6 + (i % 4) * 0.7).toFixed(1)}s;--dl:${(-i * 1.3).toFixed(1)}s"><span class="b-name">${esc(tx(a.name))}</span><span class="b-band">${esc(s.bands[r.band])}</span></button>`; }).join('');
    const calmChips = calmAreas.map((a) => `<button class="calm-chip" data-act="goto" data-area="${a.id}">${acOn(a.id) ? `<span class="cdot ac" style="${acVar(a.id)}" aria-hidden="true"></span>` : ''}${esc(tx(a.name))}</button>`).join('');
    const ringItems = AREAS.filter((a) => !(a.id === 'postpartum' && state.setup.baby !== 1)).map((a) => { const r = res[a.id]; if (!r || !r.assessed) return { area: a.id, state: 'off' }; return r.band >= 1 ? { area: a.id, state: 'flag', sw: r.band === 2 ? 24 : 18, r: r.band === 2 ? 103 : 100 } : { area: a.id, state: 'done' }; });
    const yourCompass = exp.ring ? `${N3D.ok ? '<div class="scene-gap yc-gap" aria-hidden="true"></div>' : ''}<div class="your-compass${reduceMotion || state.ycAnimKey === `${lvl}` ? '' : ' anim'}"><div class="yc-ring"><svg viewBox="0 0 240 240" aria-hidden="true">${ringSegments(ringItems, 240, 96, 10, 3, !reduceMotion && state.ycAnimKey !== `${lvl}`)}<circle class="yc-inner" cx="120" cy="120" r="80"/><g class="yc-rose">${rose(120, 74, 56, 16)}</g></svg><div class="yc-center"><strong id="yc-n" data-n="${flaggedAreas.length}">${flaggedAreas.length}</strong><span>${esc(flaggedAreas.length === 1 ? s.withSignal1 : s.withSignal)}</span></div></div><p class="small center">${esc(s.ringLegend)}</p></div>` : '';
    const tiles = `${bubbles ? `<div class="bubbles">${bubbles}</div>` : ''}
      ${calmAreas.length ? `<div class="calm-card"><strong id="calm-h">${esc(s.bands[0])} · ${calmAreas.length}</strong><div class="calm-chips" role="group" aria-labelledby="calm-h">${calmChips}</div></div>` : ''}
      ${notAssessed.length ? `<p class="small">${esc(s.notAssessedShort)}: ${esc(notAssessed.map((a) => tx(a.name)).join(', '))}</p>` : ''}`;
    const row = (a) => {
      const r = res[a.id];
      return `<li class="area band-${r.band}" id="area-${a.id}" tabindex="-1">
        <div class="area-top">${icon(a.id, 'mini-ill')}<h3>${esc(tx(a.name))}</h3><span class="pill pill-${r.band}">${esc(s.bands[r.band])}</span></div>
        <p class="score">${esc(tx(r.score))}</p>
        ${r.extra ? `<p class="score extra">${esc(tx(r.extra))}</p>` : ''}
        <p class="conf">${esc(s.confidence)}: <span class="chip chip-${r.confidence}">${esc(s.conf[r.confidence])}</span>${r.provisional ? ` <span class="chip chip-prov">${esc(s.provisionalChip)}</span>` : ''}</p>
        <details data-basis="${a.id}"><summary>${esc(s.basisBtn)}</summary>${r.scales.map((k) => basisPanel(k, r)).join('')}</details>
      </li>`;
    };
    const attn = assessed.filter((a) => res[a.id].band >= 1);
    const calm = assessed.filter((a) => res[a.id].band === 0);
    const lists = (attn.length ? `<h2 class="group-h">${esc(s.groupAttention)} (${attn.length})</h2><ul class="areas">${attn.map(row).join('')}</ul>` : '')
      + (calm.length ? `<h2 class="group-h">${esc(s.groupCalm)} (${calm.length})</h2><ul class="areas">${calm.map(row).join('')}</ul>` : '');
    const flagged = attn.length > 0;
    // 1 sign of 3: not needed, but the person can choose to look deeper at level 2
    const weakAreas = lvl === 1 ? calm.filter((a) => res[a.id].weak) : [];
    const optInAny = weakAreas.some((a) => state.optIn[a.id]);
    const weakCard = weakAreas.length ? `<section class="soft-card weak-card"><h2>${esc(s.weakTitle)}</h2><p class="small">${esc(s.weakText)}</p><div class="calm-chips">${weakAreas.map((a) => `<button type="button" class="calm-chip opt-chip${state.optIn[a.id] ? ' on' : ''}" data-act="optin" data-area="${a.id}" aria-pressed="${!!state.optIn[a.id]}"><span aria-hidden="true">${state.optIn[a.id] ? '✓ ' : '+ '}</span>${esc(tx(a.name))}</button>`).join('')}</div></section>` : '';
    let next = '';
    if (lvl === 1) next = !flagged && !optInAny ? `<p class="small">${esc(weakAreas.length ? s.noFlagsWeak : s.noFlags)}</p>` : modulesFor(2, state).length ? `<button class="btn primary big" data-act="go2">${esc(s.goLevel2)}</button>` : `<p class="small">${esc(s.noLevel2)}</p>`;
    if (lvl === 2) next = flagged ? `<button class="btn primary big" data-act="go3">${esc(s.goLevel3)}</button>` : `<p class="small">${esc(s.noFlags)}</p>`;
    const declinedN = Object.values(declinedByArea(state)).reduce((x, y) => x + y, 0);
    const safety = flags.safety === 'yes' ? `<div class="alert"><p>${esc(s.safetyFlag)}</p>${helpBlock(state.setup.country)}</div>` : flags.safety === 'skip' ? `<p class="note">${esc(s.safetySkipped)}</p>` : '';
    return `<main class="wrap results${N3D.ok && exp.ring ? ' scene3d' : ''}">${N3D.ok && exp.ring ? '<div class="stage3d" id="stage3d" aria-hidden="true"></div>' : ''}
      <section class="done-banner ${reduceMotion ? '' : 'enter'}">
        <span class="done-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 L10 17 L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div><p class="eyebrow">${esc(fmt(s.levelDone, { n: lvl }))}${state.justEarned ? ` · ${esc(fmt(s.earned, { n: state.justEarned }))}` : ''}</p>
        <h1 class="h-page">${esc(lvl === 3 ? s.resultsFinal : fmt(s.resultsTitleL, { n: lvl }))}</h1></div>
      </section>
      <section class="summary band-${mb}"><strong class="next-step">${esc(s.nextStep)}</strong><p class="rec">${esc(rec)}</p>${res.memory && res.memory.assessed && res.memory.band >= 1 ? `<p class="rec">${esc(s.recMemory)}</p>` : ''}<p class="small">${esc(s.disclaimer)}</p></section>
      ${safety}
      ${flags.quality ? `<p class="note warn">${esc(s.inconsistent)}</p>` : ''}
      ${declinedN ? `<p class="note">${esc(fmt(s.declinedNote, { n: declinedN }))}</p>` : ''}
      <section class="map"><h2 class="map-h">${esc(exp.ring ? s.yourCompass : s.mapTitle)}</h2>${yourCompass}<p class="small">${esc(s.tapHint)}</p>${tiles}${notAssessed.length && lvl === 1 ? `<p class="small">${esc(s.notAssessedNote)}</p>` : ''}</section>
      ${lists}
      ${weakCard}
      <div class="actions">${next}<button class="btn" data-act="report">${esc(s.seeReport)}</button><button class="btn link" data-act="restart">${esc(s.restart)}</button></div>
      <p class="small">${esc(s.pointsHint)}</p>
    </main>`;
  }

  // ---------- report ----------
  function reportText() {
    const s = S();
    const lvl = state.resultsLevel;
    const res = computeAreas(state, lvl);
    const flags = computeFlags(state);
    const date = new Date().toLocaleDateString(LOCALES[state.lang].htmlLang);
    const L = [];
    L.push(`NORT — ${s.reportTitle.toUpperCase()}`);
    L.push(`${s.reportDate}: ${date}`);
    L.push(`${s.reportLevel}: ${lvl}`);
    L.push(s.disclaimer);
    L.push('');
    if (state.talkMode) {
      const ind = collectIndicators();
      const listed = AREAS.filter((a) => ind[a.id] && ind[a.id].level !== 'none');
      L.push(`${s.reportTalk}:`);
      L.push(listed.length ? listed.map((a) => `• ${tx(a.name)}: ${ind[a.id].level === 'strong' ? s.indStrongShort : s.indSomeShort}${ind[a.id].evidence.filter(Boolean).length ? ` — ${ind[a.id].evidence.filter(Boolean).join('; ')}` : ''}`).join('\n') : `• ${s.reportNone}`);
      L.push(`  (${talkMode() === 'ai' ? s.indByAI : s.indByLocal})`);
      L.push('');
    }
    AREAS.forEach((a) => {
      const r = res[a.id];
      if (!r || !r.assessed) return;
      L.push(`• ${tx(a.name)}: ${s.bands[r.band]} — ${tx(r.score)} (${s.confidence.toLowerCase()} ${s.conf[r.confidence]})`);
      if (r.extra) L.push(`  ${tx(r.extra)}`);
      if (r.entry) L.push(`  ${s.entryNote}`);
    });
    if (lvl >= 3) {
      L.push(''); L.push(`${s.reportContext}:`);
      AREAS.forEach((a) => {
        const d = state.answers[`l3.${a.id}.dur`]; const i = state.answers[`l3.${a.id}.imp`];
        if (typeof d !== 'number' || typeof i !== 'number') return;
        L.push(`• ${tx(a.name)}: ${optLabels('duration')[OPT.duration.values.indexOf(d)]}; ${s.impactQ} ${optLabels('impact')[OPT.impact.values.indexOf(i)]}`);
      });
      const yn = (id) => { const v = state.answers[id]; return v == null ? '—' : optLabels('ynDontKnow')[OPT.ynDontKnow.values.indexOf(v)]; };
      L.push(`• ${s.profQ} ${yn('l3.prof')}`);
      L.push(`• ${s.treatQ} ${yn('l3.treat')}`);
      L.push(`• ${s.familyQ} ${yn('l3.family')}`);
      if (state.answers['l3.worse']) L.push(`• ${s.worseQ} ${state.answers['l3.worse']}`);
      if (state.answers['l3.better']) L.push(`• ${s.betterQ} ${state.answers['l3.better']}`);
    }
    const sk = Object.keys(state.skipped).filter((k) => state.skipped[k]).map((k) => k.split(':')[1]);
    if (sk.length) { L.push(''); L.push(`${s.reportSkipped}: ${Array.from(new Set(sk)).map((k) => (k === 'sens' ? SENS_AREAS.map(areaName).join(', ') : areaName(k))).join(', ')}`); }
    const dec = declinedByArea(state);
    if (Object.keys(dec).length) { L.push(''); L.push(`${s.reportDeclined}:`); Object.keys(dec).forEach((k) => L.push(`• ${areaName(k) || s.ctrlTitle}: ${dec[k]}`)); }
    L.push(''); L.push(`${s.reportFlags}:`);
    const notes = [];
    if (flags.safety === 'yes') notes.push(s.safetyFlag);
    if (flags.safety === 'skip') notes.push(s.safetySkipped);
    if (flags.quality) notes.push(s.inconsistent);
    L.push(notes.length ? notes.map((n) => `• ${n}`).join('\n') : `• ${s.reportNone}`);
    L.push('');
    const used = new Set(); Object.values(res).forEach((r) => (r.scales || []).forEach((k) => used.add(k)));
    L.push(`${s.f.cite}:`);
    used.forEach((k) => { const m = SCALES[k]; if (m) L.push(`• ${m.name} — ${m.authors}. ${s.txt[m.text]}${state.lang !== 'en' && m.text === 'official' && m.trans[state.lang] === 'provisional' ? ` (${s.trShort})` : ''}.`); });
    return L.join('\n');
  }
  function viewReport() {
    const s = S();
    return `<main class="wrap narrow">
      <h1 class="h-page">${esc(s.reportTitle)}</h1>
      <p class="lead">${esc(s.reportIntro)}</p>
      <div class="actions"><button class="btn primary" data-act="copy">${esc(s.copy)}</button><button class="btn" data-act="back-results">${esc(s.backToResults)}</button></div>
      ${state.copyMsg ? `<p class="note" role="status">${esc(state.copyMsg)}</p>` : ''}
      <pre class="report" tabindex="0">${esc(reportText())}</pre>
      <p class="small">${esc(s.pdfNote)}</p>
    </main>`;
  }

  function crisisOverlay() {
    const s = S();
